move:
  name: Move
  description: Start native continuous Matter Level Control movement.
  target:
    entity:
      domain: light
      integration: matter
  fields:
    direction:
      name: Direction
      description: Direction in which to change the level.
      required: true
      selector:
        select:
          options:
            - up
            - down
    rate:
      name: Rate
      description: Matter level units per second.
      required: false
      default: 50
      example: 50
      selector:
        number:
          min: 1
          max: 254
          mode: slider

stop:
  name: Stop
  description: Stop native Matter Level Control movement at the current level.
  target:
    entity:
      domain: light
      integration: matter
